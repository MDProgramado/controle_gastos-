<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Círculo Esquerdo (Bordô Queimado #732F3B com borda Cinza Pedra #8C8C8C) -->
  <circle cx="216" cy="246" r="112" stroke="#8C8C8C" stroke-width="22" />
  <circle cx="216" cy="246" r="112" stroke="#732F3B" stroke-width="16" />

  <!-- Círculo Direito (Bordô Queimado #732F3B com borda Cinza Pedra #8C8C8C) -->
  <circle cx="296" cy="266" r="112" stroke="#8C8C8C" stroke-width="22" />
  <circle cx="296" cy="266" r="112" stroke="#732F3B" stroke-width="16" />

  <!-- Lâmina Diagonal de Ogum (Carmesim Profundo #73030D com contorno em Preto Obsidiana #0D0D0D) -->
  <g transform="translate(256, 256) rotate(-45)">
    <path d="M -255 0 L -62 -28 L 0 -32 L 62 -28 L 255 0 L 62 28 L 0 32 L -62 28 Z" fill="#73030D" stroke="#0D0D0D" stroke-width="8" stroke-linejoin="miter" />
    
    <!-- Sulco central da lâmina em Preto Obsidiana #0D0D0D -->
    <line x1="-175" y1="0" x2="-24" y2="0" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" />
    <line x1="24" y1="0" x2="175" y2="0" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" />
    
    <!-- Núcleo central em Branco Gelo #F2F2F2 com anel Preto Obsidiana #0D0D0D -->
    <circle cx="0" cy="0" r="19" fill="#0D0D0D" />
    <circle cx="0" cy="0" r="12" fill="#F2F2F2" />
  </g>
</svg>