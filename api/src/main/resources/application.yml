server:
  # Pitfall 1 (Render): a plataforma injeta PORT — nunca hardcodar 8080 fixo
  port: ${PORT:8080}

spring:
  application:
    name: controle-financeiro-api
  jpa:
    # Flyway é dono do schema; Hibernate não toca no schema
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # classpath:db/migration = DDL SQL (V1). A migration Java V1_1 vive no pacote
    # com.controlefinanceiro.db.migration (P1) — Flyway varre pacotes de location,
    # então o pacote dela precisa estar listado para ser descoberta.
    locations:
      - classpath:db/migration
      - classpath:com/controlefinanceiro/db/migration
  jackson:
    time-zone: America/Sao_Paulo
    deserialization:
      # Rejeita campos extras no body (pré-requisito do teste "campo desconhecido → 400")
      fail-on-unknown-properties: true
    serialization:
      # Preserva precisão de BigDecimal (NUMERIC(14,2)) no JSON: sem notação científica,
      # sem perda de casas decimais (DSH-05, LAN-05)
      write-bigdecimal-as-plain: true

# Segredo HS256 do JWT (Pitfall 6): por ambiente via env var JWT_SECRET (>= 32 bytes;
# gere com `openssl rand -base64 48`). JwtService falha rápido se ausente/fraco.
# Em teste a env var vem do fixture óbvio do surefire (D-04 — nunca valor real).
jwt:
  secret: ${JWT_SECRET:}

# Configuração da IA (fase 4 — OpenRouter + Gemini).
# A chave da API deve ser definida via env var OPENROUTER_API_KEY.
ai:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    modelo: ${AI_OPENROUTER_MODELO:google/gemini-2.0-flash-001}
