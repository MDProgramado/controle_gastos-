server:
  # Pitfall 1 (Render): a plataforma injeta PORT — nunca hardcodar 8080 fixo
  port: ${PORT:8080}

spring:
  application:
    name: controle-financeiro-api
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:api/.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    # Flyway é dono do schema; Hibernate não toca no schema
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # classpath:db/migration = DDL SQL (V1). A migration Java V1_1 vive no pacote
    # com.controlefinanceiro.db.migration (P1) — Flyway varre pacotes de location,
    # então o pacote dela precisa estar listado para ser descoberta.
    locations:
      - classpath:db/migration
      - classpath:com/controlefinanceiro/db/migration
  jackson:
    time-zone: America/Sao_Paulo
    deserialization:
      # Rejeita campos extras no body (pré-requisito do teste "campo desconhecido → 400")
      fail-on-unknown-properties: true
    serialization:
      # Preserva precisão de BigDecimal (NUMERIC(14,2)) no JSON: sem notação científica,
      # sem perda de casas decimais (DSH-05, LAN-05)
      write-bigdecimal-as-plain: true

  servlet:
    multipart:
      # API mais permissiva que o BFF da Vercel (4 MB/arquivo): 8 MB/arquivo, 40 MB por requisição.
      max-file-size: 8MB
      max-request-size: 40MB

# Configuração da importação de PDFs (fase 5 — custo zero, sem OCR).
importacao:
  max-paginas: ${IMPORTACAO_MAX_PAGINAS:200}
  max-caracteres: ${IMPORTACAO_MAX_CARACTERES:200000}

# Segredo HS256 do JWT (Pitfall 6): por ambiente via env var JWT_SECRET (>= 32 bytes;
# gere com `openssl rand -base64 48`). JwtService falha rápido se ausente/fraco.
# Em teste a env var vem do fixture óbvio do surefire (D-04 — nunca valor real).
jwt:
  secret: ${JWT_SECRET:}

# Fase 4 (D-01): Client ID do OAuth Client Web — valor público, sem segredo.
# GoogleTokenValidator falha rápido se ausente; o client secret vive somente no BFF (Vercel).
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  connect-timeout-ms: ${GOOGLE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${GOOGLE_READ_TIMEOUT_MS:3000}

# Configuração da IA (fase 4 — OpenRouter + Gemma 4 31B Instruct).
# A chave da API deve ser definida via env var OPENROUTER_API_KEY.
ai:
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    connect-timeout-ms: ${OPENROUTER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${OPENROUTER_READ_TIMEOUT_MS:25000}
    chat-deadline-ms: ${AI_OPENROUTER_CHAT_DEADLINE_MS:50000}
    max-tokens-chat: ${AI_OPENROUTER_MAX_TOKENS_CHAT:2000}
    # Temperatura do chat: baixa porque a mesma chamada extrai lançamentos (ideal ~0.1) e
    # responde consultas/educação (~0.4).
    temperatura-chat: ${AI_OPENROUTER_TEMPERATURA_CHAT:0.2}
    # MODELOS PAGOS por padrão: os modelos ":free" são servidos por provedores que podem
    # registrar e treinar com os prompts e não garantem a política de dados abaixo. Como o chat
    # e a extração recebem dados financeiros reais de clientes (LGPD), o padrão é sempre pago.
    # Modelos ":free" só via env var — somente para desenvolvimento, nunca com dados reais de
    # clientes.
    modelo: ${AI_OPENROUTER_MODELO:google/gemma-4-31b-it}
    embedding-model: ${AI_OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
    # Política de dados enviada em TODA requisição (chat, extração, embeddings) no objeto
    # "provider" da OpenRouter: data_collection=deny (sem provedores que coletam/treinam) e
    # zdr=true (somente endpoints Zero Data Retention).
    data-collection: ${AI_OPENROUTER_DATA_COLLECTION:deny}
    zdr: ${AI_OPENROUTER_ZDR:true}
    # Cascata de modelos do chat (separados por vírgula). O cliente tenta em ordem,
    # respeitando o orçamento total de tempo do chat. Primário fixo; secundário configurável.
    modelos: ${AI_OPENROUTER_MODELOS:google/gemma-4-31b-it,${AI_OPENROUTER_MODELO_SECUNDARIO:google/gemma-4-26b-a4b-it}}
    # Último recurso: entra em campo só quando a cascata inteira falha. Com a cascata já paga,
    # fica desligado por padrão ("none" desliga a lista — em Windows uma env var vazia é
    # removida pelo sistema).
    modelos-reserva: ${AI_OPENROUTER_MODELOS_RESERVA:none}

    # Cascata específica da extração de PDFs (fase 5). Mesma política: somente modelos pagos
    # por padrão (o PDF traz extrato bancário real do cliente).
    modelos-extracao: ${AI_OPENROUTER_MODELOS_EXTRACAO:google/gemma-4-31b-it,${AI_OPENROUTER_MODELO_SECUNDARIO:google/gemma-4-26b-a4b-it}}
    temperature-extracao: ${AI_OPENROUTER_TEMPERATURA_EXTRACAO:0.0}
    max-tokens-extracao: ${AI_OPENROUTER_MAX_TOKENS_EXTRACAO:8000}
    tentativas-extracao: ${AI_OPENROUTER_TENTATIVAS_EXTRACAO:3}
    espera-inicial-ms-extracao: ${AI_OPENROUTER_ESPERA_INICIAL_MS_EXTRACAO:1500}

  rag:
    corpus-path: ${AI_RAG_CORPUS_PATH:rag/corpus_financeiro_RAG_chunks.jsonl}
    embedding-batch-size: ${AI_RAG_EMBEDDING_BATCH_SIZE:64}
    # Similaridade de cosseno mínima (1 - distância) para um trecho entrar no contexto.
    similaridade-minima: ${AI_RAG_SIMILARIDADE_MINIMA:0.60}

# WhatsApp (Meta Cloud API). Segredos somente via env var; ausência de token/secret
# desliga o envio e faz o webhook responder 503 (nunca aceita requisição sem validação).
whatsapp:
  verify:
    token: ${WHATSAPP_VERIFY_TOKEN:}
  app:
    secret: ${WHATSAPP_APP_SECRET:}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:15000}
