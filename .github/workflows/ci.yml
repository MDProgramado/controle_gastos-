name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests (Docker-free)
        run: ./mvnw -B verify
      - name: Spotless
        run: ./mvnw -B spotless:check

  web:
    name: Web (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      API_URL: http://localhost:8080
      GOOGLE_CLIENT_ID: ci-client-id
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-client-id
      NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Playwright unit specs (sem servidor)
        run: npx playwright test e2e/frontend-fixes.spec.ts e2e/google-oauth.spec.ts e2e/auth-bff.spec.ts e2e/user-helpdesk.spec.ts
      - name: Build
        run: npm run build
